{% load static %}
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar • Rose Freitas</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body class="login-body"><div class="login-box"><a class="brand" href="{% url 'home' %}"><span>ROSE</span> FREITAS</a><span class="eyebrow">ÁREA ADMINISTRATIVA</span><h1>Entrar no painel</h1>{% if form.errors %}<div class="flash error">Usuário ou senha inválidos.</div>{% endif %}<form method="post">{% csrf_token %}<label>Usuário</label><input class="form-control" type="text" name="username" autofocus required><label>Senha</label><input class="form-control" type="password" name="password" required><button class="btn gold full" type="submit">Entrar</button></form><a class="back" href="{% url 'home' %}">← Voltar para o site</a></div></body></html>
