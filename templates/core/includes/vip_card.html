<article class="rf-vip-card spotlight-card" data-reveal>
  <div class="rf-vip-card-head">
    <span class="rf-vip-channel">{{ p.get_vip_channel_display|default:'Comunidade VIP' }}</span>
    <span class="rf-vip-number">0{{ forloop.counter }}</span>
  </div>
  <h3>{{ p.title }}</h3>
  <p>{{ p.description }}</p>
  <div class="rf-vip-card-bottom">
    <strong>{% if p.price > 0 %}R$ {{ p.price|floatformat:2 }}{% else %}Consulte as condições{% endif %}</strong>
    <a href="{% url 'vip_request' p.slug %}">Solicitar participação ↗</a>
  </div>
</article>
